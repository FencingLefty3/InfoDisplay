<!DOCTYPE html>
<html>
<head>
    <meta lang="en">
    <meta charset="utf-8">
    <title>Info Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="containerA" id="doubleContainer">
        <div class="containerC">
            <nav class="snapDots" aria-label="Left pane pages">
                <button type="button" aria-label="Page 1" aria-current="true"></button>
                <button type="button" aria-label="Page 2"></button>
            </nav>
            <div class="containerD" id="info">
                <div id="plainTime"></div>
            </div>
            <div class="containerD" id="info">
                <div id="plainDate"></div>
            </div>
        </div>
        <div class="containerC">
            <nav class="snapDots" aria-label="Right pane pages">
                <button type="button" aria-label="Page 1" aria-current="true"></button>
                <button type="button" aria-label="Page 2"></button>
            </nav>
            <div class="containerD" id="info">
                <div id="calendar">c</div>
            </div>
            <div class="containerD" id="info">
                <div id="calendar">d</div>
            </div>
        </div>
    </div>
    <div class="containerA" id="singleContainer">
        <nav class="snapDots" aria-label="Info face pages">
            <button type="button" aria-label="Page 1" aria-current="true"></button>
            <button type="button" aria-label="Page 2"></button>
            <button type="button" aria-label="Page 3"></button>
        </nav>
        <div class="containerB" id="gradient">
            <div id="gradientTime"></div>
        </div>
        <div class="containerB" id="info">
            <div id="infoTime"></div>
        </div>
        <main id="board">

        </main>
        
    </div>
    <footer id="hiddenButtons">
        <a id="settingsBtn" href="#"></a>
        <a id="fullscreen" href="#">&#9974;</a>
    </footer>
</body>

<dialog id="settingsDialog">
    <h2>Color</h2>
    <div id="colorRow" class="row">

    </div>
</dialog>
<script type="module" src="app.js"></script>
</html>
