<!DOCTYPE html>
<html>
<head>
    <meta lang="en">
    <meta charset="utf-8">
    <title>Info Display</title>
    <link rel="icon" href="flap.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="containerA" id="doubleContainer">
        <div class="containerC">
            <nav class="snapDots" aria-label="Left pane pages">
                <button type="button" aria-label="Page 1" aria-current="true"></button>
                <button type="button" aria-label="Page 2"></button>
            </nav>
            <div class="containerD" id="info">
                <div id="plainTime"></div>
            </div>
            <div class="containerD" id="info">
                <div id="plainDate"></div>
            </div>
        </div>
        <div class="containerC">
            <nav class="snapDots" aria-label="Right pane pages">
                <button type="button" aria-label="Page 1" aria-current="true"></button>
                <button type="button" aria-label="Page 2"></button>
            </nav>
            <div class="containerD" id="info">
                <div id="phase"></div>
            </div>
            <div class="containerD" id="info">
                <div id="event"></div>
            </div>
            <div class="containerD" id="info">
                <div id="battery"></div>
            </div>
        </div>
    </div>
    <div class="containerA" id="singleContainer">
        <nav class="snapDots" aria-label="Info face pages">
            <button type="button" aria-label="Page 1" aria-current="true"></button>
            <button type="button" aria-label="Page 2"></button>
            <button type="button" aria-label="Page 3"></button>
        </nav>
        <div class="containerB" id="gradient">
            <div id="gradientTime"></div>
        </div>
        <div class="containerB" id="info">
            <div id="worldClock"></div>
        </div>
        z
        <main id="board">

        </main>
        
    </div>
    <footer id="hiddenButtons">
        <a id="settingsBtn" class="face-hidden" href="#"></a>
        <a id="fullscreen" href="#">&#9974;</a>
    </footer>
</body>
<dialog id="eventDialog">
    <h2>Event</h2>
    <form id="eventForm">
        <input id="eventNameInput" type="text" maxlength="36" placeholder="Event name" required>
        <input id="eventTimeInput" type="datetime-local" required>
        <button type="submit">Save</button>
        <button type="button" id="eventClear">Clear</button>
        <button type="button" id="eventCancel">Cancel</button>
    </form>
</dialog>
<dialog id="worldDialog">
    <h2>World clock</h2>
    <form id="worldForm">
        <div id="worldPickers"></div>
        <div class="worldButtons">
            <button type="submit">Save</button>
            <button type="button" id="worldReset">Reset</button>
            <button type="button" id="worldCancel">Cancel</button>
        </div>
    </form>
</dialog>
<dialog id="settingsDialog">
    <h2>Color</h2>
    <div id="colorRow" class="row">

    </div>
</dialog>
<script type="module" src="app.js"></script>
</html>
